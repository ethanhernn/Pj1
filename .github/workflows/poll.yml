name: edgar-poll

# Poll every 15 minutes during US market hours on weekdays.
# 13:00-21:00 UTC ≈ 09:00-17:00 ET (covers the regular session + filing release window).
on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without sending ntfy pushes"
        type: boolean
        default: false
      seed_only:
        description: "Seed seen_filings.json and exit"
        type: boolean
        default: false

# Allow the workflow to commit updated state back to the branch.
permissions:
  contents: write

concurrency:
  group: edgar-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run poll cycle
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          EDGAR_UA: ${{ secrets.EDGAR_UA }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.seed_only }}" = "true" ]; then ARGS="$ARGS --seed-only"; fi
          python -m src.main $ARGS

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ output/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update EDGAR monitor state [skip ci]"
            git push
          fi
