name: edgar-poll

# Poll every 15 minutes during US market hours on weekdays.
# 13:00-21:00 UTC ≈ 09:00-17:00 ET (covers the regular session + filing release window).
on:
  schedule:
    # Normal cadence: every 15 minutes during US market hours on weekdays.
    - cron: "*/15 13-21 * * 1-5"
    # Deadline weeks (mid Feb/May/Aug/Nov, ~45 days after quarter end): every
    # 5 minutes, days 10-20. Kept in sync with src/deadline.py.
    - cron: "*/5 13-21 10-20 2,5,8,11 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without sending ntfy pushes"
        type: boolean
        default: false
      seed_only:
        description: "Seed seen_filings.json and exit"
        type: boolean
        default: false

# Allow the workflow to commit updated state back to the branch.
permissions:
  contents: write

concurrency:
  group: edgar-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run poll cycle
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          EDGAR_UA: ${{ secrets.EDGAR_UA }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.seed_only }}" = "true" ]; then ARGS="$ARGS --seed-only"; fi
          python -m src.main $ARGS

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ output/ docs/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update EDGAR monitor state [skip ci]"
          branch="${GITHUB_REF_NAME}"
          # Concurrent poll runs (especially the deadline-week 5-minute cadence) can
          # push to this branch between our checkout and our push, which rejects the
          # push as non-fast-forward. On rejection, rebase our state commit onto the
          # latest remote and retry. `-X theirs` lets our run's regenerated state win
          # file-level conflicts while keeping the other run's distinct output files.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto latest ${branch}."
            git fetch origin "${branch}"
            git rebase -X theirs "origin/${branch}" || { git rebase --abort || true; sleep 3; continue; }
            sleep $(( (RANDOM % 4) + attempt ))
          done
          echo "::error::Failed to push updated state after multiple attempts."
          exit 1
